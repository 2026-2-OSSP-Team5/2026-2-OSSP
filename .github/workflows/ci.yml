name: Project checks
on: [push, pull_request]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts
      - run: python -m ruff format --check src scripts
      - run: python -m compileall -q src
      - run: python -m slideguard doctor

# Hosted runners do not provide an activated desktop PowerPoint installation.
