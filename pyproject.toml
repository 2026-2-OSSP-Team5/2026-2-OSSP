[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slideguard"
version = "0.1.0"
description = "Local PowerPoint slide readability tools"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-pptx==1.0.2",
    "PySide6-Essentials==6.12.0",
    "watchdog==6.0.0",
    "pywin32==310; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "pyinstaller==6.22.3"]

[project.scripts]
slideguard = "slideguard.cli:main"

[project.gui-scripts]
slideguard-desktop = "slideguard.ui.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
